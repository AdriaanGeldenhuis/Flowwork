plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Load keystore properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'app.flowwork'
    compileSdk 36

    defaultConfig {
        applicationId "app.flowwork"
        minSdk 24
        // Google Play requires new releases to target the latest Android
        // version. Targeting 35+ makes the app draw edge-to-edge and 36 turns
        // on predictive Back, both handled in WebShellActivity.
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Origin-restricted JS bridge (downloads, printing, status-bar colour)
    // and scripts injected before page scripts run.
    implementation 'androidx.webkit:webkit:1.15.0'

    // WebDAV client for the FlowDrive documents provider
    // (HttpURLConnection cannot send PROPFIND/MKCOL/MOVE/COPY).
    // Also used for the notification Mark as read / Archive buttons.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JVM tests of the notification/link logic: ./gradlew testDebugUnitTest
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.6.1'
}
