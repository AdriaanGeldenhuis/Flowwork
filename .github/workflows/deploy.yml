name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-2222}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Rsync to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # No --delete: server-only files are never removed.
          # "app files/" (the Android Studio project) is copied too, so the
          # server always has the current app; its .htaccess blocks web access.
          # Build output and signing files are never copied.
          rsync -rlptvz \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-2222}" \
            --exclude='.git' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='config.php' \
            --exclude='mail/config.php' \
            --exclude='*.env' \
            --exclude='*.log' \
            --exclude='*.md' \
            --exclude='/Migrations/' \
            --exclude='/tests/' \
            --exclude='/uploads/' \
            --exclude='/storage/' \
            --exclude='/logs/' \
            --exclude='/app files/.gradle/' \
            --exclude='/app files/build/' \
            --exclude='/app files/app/build/' \
            --exclude='local.properties' \
            --exclude='keystore.properties' \
            --exclude='*.jks' \
            --exclude='*.keystore' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
